const typeColorMap={
"央企":"tag-cyang",
"国企":"tag-guozi",
"国资控股":"tag-guozi-kong",
"上市民企":"tag-minshang",
"外企":"tag-waiqi",
"其他民企":"tag-minshang2"
};

function getCity(cityStr){
if(cityStr.indexOf("北京")>=0)return "北京";
if(cityStr.indexOf("南京")>=0)return "南京";
if(cityStr.indexOf("合肥")>=0)return "合肥";
return "其他";
}

function renderJobs(){
const grid=document.getElementById("jobGrid");
const fCity=document.getElementById("filterCity").value;
const fType=document.getElementById("filterType").value;
const fPlatform=document.getElementById("filterPlatform").value;
const fExp=document.getElementById("filterExp").value;
const search=document.getElementById("searchBox").value.toLowerCase();
let filtered=jobs.filter(j=>{
const city=getCity(j["城市"]);
if(fCity&&city!==fCity)return false;
if(fType&&j["公司类型"]!==fType)return false;
if(fPlatform&&j["平台"]!==fPlatform)return false;
if(fExp&&j["经验要求"]!==fExp)return false;
if(search){
const text=(j["岗位名称"]+j["公司名称"]).toLowerCase();
if(text.indexOf(search)<0)return false;
}
return true;
});
if(filtered.length===0){
grid.innerHTML="";
document.getElementById("noResults").style.display="block";
return;
}
document.getElementById("noResults").style.display="none";
grid.innerHTML=filtered.map((j,idx)=>{
const tc=typeColorMap[j["公司类型"]]||"tag-minshang2";
const vStatus=j["公司工商验证"]=="已验证"?"v-passed":"v-pending";
const rStatus=j["招聘信息验证"]=="已验证"?"v-passed":"v-pending";
return `<div class="job-card" onclick="showDetail(${idx})">
<span class="company-tag ${tc}">${j["公司类型"]}</span>
<span class="new-badge">新增</span>
<h3>${j["岗位名称"]}</h3>
<div class="company">${j["公司名称"]}</div>
<div class="info">
<span class="salary">${j["薪资范围"]}</span>
<span class="city">${j["城市"]}</span>
<span class="exp">${j["经验要求"]}</span>
<span class="edu">${j["学历要求"]}</span>
<span class="platform">${j["平台"]}</span>
</div>
<div class="verify">
<span class="${vStatus}">工商:${j["公司工商验证"]}</span>
<span class="${rStatus}">| 招聘:${j["招聘信息验证"]}</span>
</div>
</div>`;
}).join("");
window.filteredJobs=filtered;
}

function showDetail(idx){
const j=window.filteredJobs[idx];
const detail=document.getElementById("jobDetail");
const body=document.getElementById("detailBody");
body.innerHTML=`
<h2>${j["岗位名称"]}</h2>
<div class="detail-row"><span class="label">公司名称</span><span class="value">${j["公司名称"]}</span></div>
<div class="detail-row"><span class="label">公司类型</span><span class="value">${j["公司类型"]}</span></div>
<div class="detail-row"><span class="label">城市</span><span class="value">${j["城市"]}</span></div>
<div class="detail-row"><span class="label">薪资范围</span><span class="value" style="color:#f5222d;font-weight:700;">${j["薪资范围"]}</span></div>
<div class="detail-row"><span class="label">经验要求</span><span class="value">${j["经验要求"]}</span></div>
<div class="detail-row"><span class="label">学历要求</span><span class="value">${j["学历要求"]}</span></div>
<div class="detail-row"><span class="label">招聘平台</span><span class="value">${j["平台"]}</span></div>
<div class="detail-row"><span class="label">采集日期</span><span class="value">${j["日期"]}</span></div>
<div class="detail-row"><span class="label">公司工商验证</span><span class="value">${j["公司工商验证"]}</span></div>
<div class="detail-row"><span class="label">招聘信息验证</span><span class="value">${j["招聘信息验证"]}</span></div>
<div class="detail-row"><span class="label">备注</span><span class="value">${j["备注"]}</span></div>
<div class="detail-row"><span class="label">是否新增</span><span class="value" style="color:#f5222d;font-weight:700;">${j["是否新增"]}</span></div>
<a class="apply-btn" href="${j["岗位链接"]}" target="_blank">投递岗位</a>
`;
detail.classList.add("active");
}

function closeDetail(e){
if(e.target===document.getElementById("jobDetail")){
document.getElementById("jobDetail").classList.remove("active");
}
}

function exportCSV(){
let csv="日期,平台,岗位名称,公司名称,公司类型,城市,薪资范围,经验要求,学历要求,岗位链接,公司工商验证,招聘信息验证,备注,是否新增\n";
window.filteredJobs.forEach(j=>{
csv+=`${j["日期"]},${j["平台"]},${j["岗位名称"]},${j["公司名称"]},${j["公司类型"]},${j["城市"]},${j["薪资范围"]},${j["经验要求"]},${j["学历要求"]},${j["岗位链接"]},${j["公司工商验证"]},${j["招聘信息验证"]},${j["备注"]},${j["是否新增"]}\n`;
});
const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="jobs_filtered.csv";
a.click();
URL.revokeObjectURL(url);
}

document.getElementById("filterCity").addEventListener("change",renderJobs);
document.getElementById("filterType").addEventListener("change",renderJobs);
document.getElementById("filterPlatform").addEventListener("change",renderJobs);
document.getElementById("filterExp").addEventListener("change",renderJobs);
document.getElementById("searchBox").addEventListener("input",renderJobs);

renderJobs();
</script>
