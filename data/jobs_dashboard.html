const typeColorMap = {
"央企":"tag-cyang",
"国企":"tag-guozi",
"国资控股":"tag-guozi-kong",
"上市民企":"tag-minshang",
"上市国企":"tag-shangshi-guoqi",
"外企":"tag-waiqi",
"其他民企（独角兽）":"tag-dujiao",
"其他民企（大型）":"tag-minshang2",
"其他民企":"tag-qita"
};

function getCity(cityStr){
if(!cityStr)return "其他";
if(cityStr.indexOf("北京")>=0)return "北京";
if(cityStr.indexOf("南京")>=0)return "南京";
if(cityStr.indexOf("合肥")>=0)return "合肥";
return cityStr;
}

function getTypeClass(typeStr){
if(typeStr in typeColorMap)return typeColorMap[typeStr];
if(typeStr.indexOf("央企")>=0)return "tag-cyang";
if(typeStr.indexOf("上市国企")>=0)return "tag-shangshi-guoqi";
if(typeStr.indexOf("国企")>=0)return "tag-guozi";
if(typeStr.indexOf("国资")>=0)return "tag-guozi-kong";
if(typeStr.indexOf("上市")>=0)return "tag-minshang";
if(typeStr.indexOf("外企")>=0)return "tag-waiqi";
if(typeStr.indexOf("独角兽")>=0)return "tag-dujiao";
return "tag-qita";
}

function escapeHtml(text){
if(!text)return "";
const div=document.createElement("div");
div.textContent=text;
return div.innerHTML;
}

function renderJobs(){
const grid=document.getElementById("jobGrid");
const fCity=document.getElementById("filterCity").value;
const fType=document.getElementById("filterType").value;
const fPlatform=document.getElementById("filterPlatform").value;
const fExp=document.getElementById("filterExp").value;
const fNew=document.getElementById("filterNew").value;
const search=document.getElementById("searchBox").value.toLowerCase();
let filtered=jobs.filter(j=>{
const city=getCity(j["城市"]||"");
if(fCity&&city!==fCity)return false;
if(fType&&j["公司类型"]!==fType)return false;
if(fPlatform&&j["平台"]!==fPlatform)return false;
if(fExp&&j["经验要求"]!==fExp)return false;
if(fNew&&j["是否新增"]!==fNew)return false;
if(search){
const text=(j["岗位名称"]+j["公司名称"]).toLowerCase();
if(text.indexOf(search)<0)return false;
}
return true;
});

document.getElementById("resultInfo").innerHTML="当前显示 <b>"+filtered.length+"</b> 个岗位 / 共 "+jobs.length+" 个";

if(filtered.length===0){
grid.innerHTML="";
document.getElementById("noResults").style.display="block";
return;
}
document.getElementById("noResults").style.display="none";

// Sort: new jobs first, then by salary desc
filtered.sort((a,b)=>{
if(a["是否新增"]==="是"&&b["是否新增"]!=="是")return -1;
if(a["是否新增"]!=="是"&&b["是否新增"]==="是")return 1;
return 0;
});

grid.innerHTML=filtered.map((j,idx)=>{
const tc=getTypeClass(j["公司类型"]||"");
const vStatus=(j["公司工商验证"]||"").indexOf("已验证")>=0?"v-passed":"v-pending";
const rStatus=(j["招聘信息验证"]||"").indexOf("已验证")>=0?"v-passed":"v-pending";
const isNew=j["是否新增"]==="是";
const badge=isNew?'<span class="new-badge">NEW</span>':'<span class="old-badge">存量</span>';
const city=getCity(j["城市"]||"");
const salary=j["薪资范围"]||"面议";
const exp=j["经验要求"]||"不限";
const edu=j["学历要求"]||"不限";
const platform=j["平台"]||"";
const title=j["岗位名称"]||"";
const company=j["公司名称"]||"";
const companyType=j["公司类型"]||"";
const verifyCompany=j["公司工商验证"]||"待验证";
const verifyJob=j["招聘信息验证"]||"待验证";
const note=j["备注"]||"";
return `<div class="job-card" onclick="showDetail(${idx})">
${badge}
<span class="company-tag ${tc}">${escapeHtml(companyType)}</span>
<h3>${escapeHtml(title)}</h3>
<div class="company">${escapeHtml(company)}</div>
<div class="info">
<span class="salary">${escapeHtml(salary)}</span>
<span class="city">${escapeHtml(city)}</span>
<span class="exp">${escapeHtml(exp)}</span>
<span class="edu">${escapeHtml(edu)}</span>
<span class="platform">${escapeHtml(platform)}</span>
</div>
<div class="note-preview">${escapeHtml(note)}</div>
<div class="verify">
<span class="${vStatus}">工商: ${escapeHtml(verifyCompany)}</span>
<span class="${rStatus}">| 招聘: ${escapeHtml(verifyJob)}</span>
</div>
</div>`;
}).join("");
window.filteredJobs=filtered;
}

function showDetail(idx){
const j=window.filteredJobs[idx];
const detail=document.getElementById("jobDetail");
const body=document.getElementById("detailBody");

function exportCSV(){
let csv="\u65e5\u671f,\u5e73\u53f0,\u5c97\u4f4d\u540d\u79f0,\u516c\u53f8\u540d\u79f0,\u516c\u53f8\u7c7b\u578b,\u57ce\u5e02,\u85aa\u8d44\u8303\u56f4,\u7ecf\u9a8c\u8981\u6c42,\u5b66\u5386\u8981\u6c42,\u5c97\u4f4d\u94fe\u63a5,\u516c\u53f8\u5de5\u5546\u9a8c\u8bc1,\u62db\u8058\u4fe1\u606f\u9a8c\u8bc1,\u5907\u6ce8,\u662f\u5426\u65b0\u589e\n";
const headers=["日期","平台","岗位名称","公司名称","公司类型","城市","薪资范围","经验要求","学历要求","岗位链接","公司工商验证","招聘信息验证","备注","是否新增"];
csv=headers.join(",")+"\n";
window.filteredJobs.forEach(j=>{
const row=headers.map(h=>j[h]||"");
csv+=row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")+"\n";
});
const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="jobs_filtered_2026-08-11.csv";
a.click();
URL.revokeObjectURL(url);
}

document.getElementById("filterCity").addEventListener("change",renderJobs);
document.getElementById("filterType").addEventListener("change",renderJobs);
document.getElementById("filterPlatform").addEventListener("change",renderJobs);
document.getElementById("filterExp").addEventListener("change",renderJobs);
document.getElementById("filterNew").addEventListener("change",renderJobs);
document.getElementById("searchBox").addEventListener("input",renderJobs);

renderJobs();
</script>
